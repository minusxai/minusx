name: Capture original utility runtime profile
on:
  push:
    branches: [qualification/util-target-20261029]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture actual baseline before tool packages or utility overlays
        run: docker buildx build --progress=plain --no-cache-filter runtime-profile,util-original --target util-original-proof --output type=local,dest=util-original-profile frontend
      - name: Bind captured technical profile to exact public source
        run: |
          python3 - <<'PYBIND'
          import hashlib,json,os,pathlib
          files=['frontend/Dockerfile','frontend/scripts/util-consumer/capture-original.mjs','.github/workflows/util-original-evidence.yml']
          binding={'schema':1,'head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'source_sha256':{name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files}}
          pathlib.Path('util-original-profile/source-binding.json').write_text(json.dumps(binding,sort_keys=True)+'\n')
          PYBIND
      - name: Retain original technical utility profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: util-original-profile
          path: util-original-profile
          if-no-files-found: error
          retention-days: 7
