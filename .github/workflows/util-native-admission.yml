name: Qualify exact util package and native closure
on:
  push:
    branches: [qualification/util-native-20261028]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate retained prepared packages from exact reviewed producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qualification/util-admission/fetch-prepared-packages.py qualification/util-admission/prepared-package.lock.json util-package-candidate
      - name: Prepare minimal native-only context
        run: |
          set -eu
          context="$RUNNER_TEMP/util-admission"
          mkdir -p "$context"
          cp -R qualification/util-admission "$context/checks"
          cp -R frontend/scripts/perl/perl-consumer-tools "$context/tool-recipe"
          cp frontend/scripts/patch-npm.mjs "$context/patch-npm.mjs"
          cp qualification/util-admission/Dockerfile.prepared-native "$context/Dockerfile"
      - name: Require complete typed package gates before native transaction
        run: python3 qualification/util-admission/check-package-status.py util-package-candidate/package-status.json
      - name: Fresh native installation and complete resolver preservation gates
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --progress=plain --build-context prepared-util="$GITHUB_WORKSPACE/util-package-candidate" --target runtime-profile --load -t util-native-original:proof "$RUNNER_TEMP/util-admission"
          docker buildx build --progress=plain --no-cache-filter native --build-context prepared-util="$GITHUB_WORKSPACE/util-package-candidate" --target native --load -t util-native-candidate:proof "$RUNNER_TEMP/util-admission" 2>&1 | tee "$RUNNER_TEMP/util-native.log"
          docker buildx build --progress=plain --build-context prepared-util="$GITHUB_WORKSPACE/util-package-candidate" --target native-export --output type=local,dest=util-native-proof "$RUNNER_TEMP/util-admission"
      - name: Bind exact images and execute isolated mandatory namespace proof
        run: |
          set -eu
          original=$(docker image inspect --format '{{.Id}}' util-native-original:proof)
          candidate=$(docker image inspect --format '{{.Id}}' util-native-candidate:proof)
          python3 qualification/util-admission/bind-namespace-images.py "$original" "$candidate" util-package-candidate util-native-proof util-native-proof/namespace-image-provenance.json
          python3 qualification/util-admission/check-namespace-containers.py "$original" "$candidate" util-native-proof/namespace-kernel-proof.json
      - name: Bind successful unadmitted native candidate receipts
        run: python3 qualification/util-admission/record-native-candidate.py util-package-candidate util-native-proof qualification/util-admission/debian-compile.lock.json
      - name: Retain unadmitted package candidate and technical native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: util-package-native-candidate
          path: |
            util-package-candidate
            util-native-proof
          if-no-files-found: error
          retention-days: 7
