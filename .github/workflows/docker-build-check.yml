# Validates the production Docker image builds on PRs — without pushing or
# deploying anything. Exists because the publish workflow only runs on merge
# to main, so Dockerfile/patches/lockfile breakage was invisible in PR CI
# (e.g. the pi-ai patch guard pointing at a renamed package path).
#
# Path-filtered to the files that can actually break the image build; a full
# image build is too slow to run on every PR.
name: Docker Build Check

on:
  pull_request:
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'frontend/patches/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/.npmrc'
      - 'frontend/next.config.ts'
      - 'frontend/scripts/copy-duckdb-wasm.mjs'
      - 'frontend/scripts/patch-npm.mjs'
      - 'frontend/scripts/patch-esbuild.mjs'
      - 'frontend/scripts/check-runtime.cjs'
      - 'frontend/scripts/check-embedded-sqlite.cjs'
      - 'frontend/scripts/check-embedded-sqlite-exports.py'
      - 'frontend/scripts/run-native-proof.sh'
      - 'frontend/scripts/test-embedded-sqlite.cjs'
      - 'frontend/scripts/test-embedded-sqlite-exports.py'
      - 'frontend/scripts/check-system-runtime.cjs'
      - 'frontend/scripts/capture-pam-applicability.cjs'
      - 'frontend/scripts/tar-patches/**'
      - 'frontend/scripts/runtime/**'
      - 'frontend/scripts/util-linux/**'
      - 'frontend/scripts/perl/**'
      - 'frontend/scripts/network/**'
      - 'frontend/scripts/libraries/**'
      - 'frontend/scripts/sqlite/**'
      - 'frontend/scripts/curl-runtime-probe.c'
      - 'frontend/scripts/check-network-runtime.cjs'
      - 'frontend/scripts/verify-network-proof.cjs'
      - 'frontend/scripts/test-network-proof.cjs'
      - '.github/workflows/docker-build-check.yml'

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Test public Perl admission boundaries
        run: node --test frontend/scripts/perl/runtime-os/test-promotion-binding.mjs

      - name: Authenticate public Perl runtime input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node frontend/scripts/perl/fetch-promoted-perl.mjs '${{ runner.temp }}/qualified-perl'

      - uses: docker/setup-buildx-action@v3

      # Mirrors the publish job's build (same context, args, secrets) with
      # push: false — build validation only, nothing leaves the runner.
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          build-contexts: qualified-perl=${{ runner.temp }}/qualified-perl
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: app-validation
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_DEFAULT_ANALYTICS_CONFIG=${{ secrets.NEXT_PUBLIC_DEFAULT_ANALYTICS_CONFIG }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          no-cache-filters: perl-prepared
          cache-from: type=gha

      - name: Test network proof failure boundaries
        run: |
          python3 frontend/scripts/network/test-network-proof.py
          python3 frontend/scripts/test-embedded-sqlite-exports.py
          node --test frontend/scripts/test-network-proof.cjs frontend/scripts/test-embedded-sqlite.cjs

      - name: Check native runtime modules
        run: sh frontend/scripts/run-native-proof.sh app-validation /tmp/native-runtime-proof

      - name: Retain loaded native applicability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loaded-native-applicability-proof
          path: /tmp/native-runtime-proof/
          if-no-files-found: ignore
          retention-days: 7

      - name: Export network test probe
        run: >-
          docker buildx build --target network-test-tools --platform linux/amd64
          --no-cache-filter perl-prepared --build-context qualified-perl=${{ runner.temp }}/qualified-perl
          --output type=local,dest=/tmp/network-test-tools frontend

      - name: Check actual kernel keyring source coverage
        shell: bash
        run: |
          docker buildx build --target library-source-proof --platform linux/amd64 --load --tag library-source-validation frontend
          sh frontend/scripts/libraries/run-keyring-hosted.sh library-source-validation /runtime-build/libraries/run-keyring-source-proof.sh 2>&1 | tee /tmp/keyring-source-proof.log
          docker image rm library-source-validation

      - name: Retain actual kernel keyring proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-keyring-source-proof
          path: /tmp/keyring-source-proof.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check installed network runtime
        run: >-
          docker run --rm --entrypoint node
          --mount type=bind,source=/tmp/network-test-tools,target=/test-tools,readonly
          app-validation scripts/check-network-runtime.cjs /test-tools/network/test-tools/curl-runtime-probe /test-tools/libraries

      - name: Check installed util-linux runtime
        run: |
          docker run --rm --entrypoint sh \
            --mount type=bind,source=/tmp/network-test-tools/util-linux,target=/util-linux-proof,readonly \
            app-validation -ec 'sha256sum -c /util-linux-proof/runtime-payload.sha256 && /util-linux-proof/check-absence.sh /util-linux-proof/runtime-absent.paths && /util-linux-proof/check-util-linux && nsenter -- /usr/bin/true && test "$(nsenter --wd=/tmp -- /usr/bin/pwd)" = /tmp && apt-get check && audit=$(dpkg --audit 2>&1) && test -z "$audit"'

      - name: Retain original Perl and util-linux proof
        uses: actions/upload-artifact@v4
        with:
          name: perl-original-and-util-linux-proof
          path: |
            /tmp/network-test-tools/perl-original/
            /tmp/network-test-tools/perl/
            /tmp/network-test-tools/util-linux/
          if-no-files-found: error
          retention-days: 7

      - name: Check actual installed Perl profile and native modules
        run: >-
          docker run --rm --entrypoint node
          --mount type=bind,source=/tmp/network-test-tools/perl,target=/perl-proof,readonly
          --mount type=bind,source=${{ github.workspace }}/frontend/scripts/perl,target=/perl-checks,readonly
          app-validation /perl-checks/runtime-os/check-qualified-perl.mjs /perl-proof /perl-checks/runtime-os/check-normal.pl

      - name: Check installed SQLite runtime
        run: >-
          docker run --rm --entrypoint sh
          --mount type=bind,source=/tmp/network-test-tools/sqlite,target=/sqlite-proof,readonly
          app-validation /sqlite-proof/verify-sqlite.sh /sqlite-proof

      - name: Retain SQLite validation proof
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-runtime-proof
          path: /tmp/network-test-tools/sqlite/
          if-no-files-found: error
          retention-days: 7

      - name: Retain rebuilt network packages
        uses: actions/upload-artifact@v4
        with:
          name: network-source-packages
          path: |
            /tmp/network-test-tools/network/*.deb
            /tmp/network-test-tools/libraries/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Release intermediate build cache
        run: docker builder prune --all --force

      - name: Record actual PAM configuration applicability
        run: >-
          docker run --rm --entrypoint node
          --mount type=bind,source=${{ github.workspace }}/frontend/scripts/capture-pam-applicability.cjs,target=/capture-pam.cjs,readonly
          app-validation /capture-pam.cjs > pam-applicability.json

      - name: Record all image dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: app-validation
          scan-type: image
          scanners: vuln
          format: json
          output: image-scan.raw.json
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          timeout: 10m
      - name: Prepare dependency report
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY_REPORT'
          import hashlib, json, os
          from pathlib import Path
          raw = json.loads(Path('image-scan.raw.json').read_text())
          files = ['.github/workflows/docker-build-check.yml', '.github/workflows/publish.yml', 'frontend/Dockerfile', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/scripts/patch-npm.mjs', 'frontend/scripts/patch-esbuild.mjs', 'frontend/scripts/check-runtime.cjs', 'frontend/scripts/check-embedded-sqlite.cjs', 'frontend/scripts/check-embedded-sqlite-exports.py', 'frontend/scripts/run-native-proof.sh', 'frontend/scripts/test-embedded-sqlite.cjs', 'frontend/scripts/test-embedded-sqlite-exports.py', 'frontend/scripts/check-system-runtime.cjs', 'frontend/scripts/capture-pam-applicability.cjs'] + [str(p) for p in sorted(Path('frontend/scripts/tar-patches').glob('*'))] + [str(p) for p in sorted(Path('frontend/scripts/runtime').glob('*'))] + ['frontend/scripts/curl-runtime-probe.c', 'frontend/scripts/check-network-runtime.cjs', 'frontend/scripts/verify-network-proof.cjs', 'frontend/scripts/test-network-proof.cjs'] + [str(p) for p in sorted(Path('frontend/scripts/network').rglob('*')) if p.is_file()] + [str(p) for p in sorted(Path('frontend/scripts/libraries').rglob('*')) if p.is_file()] + [str(p) for directory in ('sqlite', 'util-linux', 'perl') for p in sorted(Path('frontend/scripts', directory).rglob('*')) if p.is_file()]
          report = {
              'source_head': os.environ['SOURCE_HEAD'],
              'checkout_sha': os.environ['CHECKOUT_SHA'],
              'source_hashes': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
              'SchemaVersion': raw['SchemaVersion'],
              'ArtifactName': 'app-validation',
              'ArtifactType': raw.get('ArtifactType'),
              'Metadata': {k: raw.get('Metadata', {}).get(k) for k in ('ImageID', 'DiffIDs', 'OS')},
              'Results': raw.get('Results', []),
              'pam_configuration_applicability': json.loads(Path('pam-applicability.json').read_text()),
              'coverage_limits': 'Reports recognized installed components. Stripped binaries and downloaded extensions may be absent; matching esbuild source/toolchain rebuilds and native runtime checks provide separate evidence.'
          }
          Path('image-report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY_REPORT
      - uses: actions/upload-artifact@v4
        with:
          name: image-dependencies
          path: image-report.json
          if-no-files-found: error
          retention-days: 7
